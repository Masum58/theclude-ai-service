services:
  postgres:
    image: postgres:16-alpine
    container_name: theclude-ai-postgres
    environment:
      POSTGRES_DB: ai_service
      POSTGRES_USER: ai_service
      POSTGRES_PASSWORD: ai_service
    ports:
      - "5433:5432"
    volumes:
      - ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_service -d ai_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: theclude-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - ai_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: theclude-ai-chromadb
    ports:
      - "8000:8000"
    volumes:
      - ai_chroma_data:/chroma/chroma
    # healthcheck:
    #   test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 10

volumes:
  ai_postgres_data:
  ai_redis_data:
  ai_chroma_data: